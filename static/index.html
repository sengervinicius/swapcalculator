<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hedged Return Converter - CIP Calculator</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        :root {
            --bg: #f6f7fb;
            --card: #ffffff;
            --text: #0f172a;
            --muted: #64748b;
            --border: #e2e8f0;
            --accent: #4f46e5;
            --accent2: #7c3aed;
            --shadow: 0 18px 50px rgba(2, 6, 23, 0.12);
        }
        
        body {
            font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Apple Color Emoji", "Segoe UI Emoji";
            background: radial-gradient(1200px 600px at 10% -10%, rgba(79, 70, 229, 0.18), transparent 60%),
                        radial-gradient(900px 500px at 110% 0%, rgba(124, 58, 237, 0.16), transparent 55%),
                        var(--bg);
            min-height: 100vh;
            padding: 28px;
            color: var(--text);
        }
        
        .container {
            max-width: 980px;
            margin: 0 auto;
            background: var(--card);
            border-radius: 16px;
            box-shadow: var(--shadow);
            overflow: hidden;
            border: 1px solid rgba(226, 232, 240, 0.9);
        }
        
        .header {
            background: linear-gradient(135deg, var(--accent) 0%, var(--accent2) 100%);
            color: white;
            padding: 28px 30px;
            text-align: center;
        }
        
        .header h1 {
            font-size: 1.8em;
            margin-bottom: 6px;
            letter-spacing: -0.02em;
        }
        
        .header p {
            opacity: 0.9;
            font-size: 0.95em;
        }
        
        .content {
            padding: 30px;
        }
        
        .form-section {
            margin-bottom: 25px;
        }
        
        .form-section h3 {
            font-size: 1.05em;
            margin-bottom: 14px;
            color: var(--text);
            padding-bottom: 10px;
            border-bottom: 1px solid var(--border);
        }
        
        .form-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 15px;
        }
        
        .form-group.full {
            grid-template-columns: 1fr;
        }
        
        label {
            display: block;
            font-weight: 600;
            color: #334155;
            margin-bottom: 8px;
            font-size: 0.92em;
        }
        
        input, select {
            width: 100%;
            padding: 12px 12px;
            border: 1px solid var(--border);
            border-radius: 10px;
            font-size: 1em;
            transition: border-color 0.2s, box-shadow 0.2s;
            background: white;
        }
        
        input:focus, select:focus {
            outline: none;
            border-color: rgba(79, 70, 229, 0.65);
            box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.14);
        }
        
        button {
            background: linear-gradient(135deg, var(--accent) 0%, var(--accent2) 100%);
            color: white;
            padding: 14px 40px;
            border: none;
            border-radius: 12px;
            font-size: 1em;
            font-weight: 650;
            cursor: pointer;
            transition: transform 0.15s, box-shadow 0.15s;
            width: 100%;
        }
        
        button:hover {
            transform: translateY(-1px);
            box-shadow: 0 12px 24px rgba(79, 70, 229, 0.28);
        }
        
        button:active {
            transform: translateY(0);
        }
        
        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        
        .loading {
            display: inline-block;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .results {
            margin-top: 30px;
            display: none;
            background: #f8fafc;
            padding: 22px;
            border-radius: 14px;
            border: 1px solid var(--border);
        }
        
        .results.show {
            display: block;
        }
        
        .results h3 {
            color: var(--text);
            margin-bottom: 18px;
            font-size: 1.15em;
            letter-spacing: -0.01em;
        }
        
        .result-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }
        
        .result-grid.full {
            grid-template-columns: 1fr;
        }
        
        .result-item {
            background: white;
            padding: 16px;
            border-radius: 12px;
            border: 1px solid var(--border);
        }
        
        .result-item label {
            font-size: 0.78em;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 0.06em;
            margin-bottom: 6px;
        }
        
        .result-item .value {
            font-size: 1.45em;
            font-weight: 750;
            color: var(--accent);
        }
        
        .result-item .unit {
            font-size: 0.85em;
            color: #999;
            margin-left: 5px;
        }
        
        .assumptions {
            margin-top: 18px;
            background: white;
            padding: 15px;
            border-radius: 12px;
            border: 1px solid var(--border);
        }
        
        .assumptions h4 {
            margin-bottom: 10px;
            color: #333;
            font-size: 0.95em;
        }
        
        .assumption-item {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid #eee;
            font-size: 0.9em;
        }
        
        .assumption-item:last-child {
            border-bottom: none;
        }
        
        .assumption-name {
            color: #555;
            font-weight: 500;
        }
        
        .assumption-value {
            color: var(--accent);
            font-weight: 600;
        }
        
        .error-message {
            display: none;
            background: #fee;
            color: #c33;
            padding: 15px;
            border-radius: 6px;
            margin-bottom: 20px;
            border-left: 4px solid #c33;
        }
        
        .error-message.show {
            display: block;
        }
        
        .warning {
            background: #fff7ed;
            color: #9a3412;
            padding: 12px;
            border-radius: 10px;
            margin: 10px 0;
            font-size: 0.92em;
            border: 1px solid #fed7aa;
        }
        
        @media (max-width: 600px) {
            .form-group {
                grid-template-columns: 1fr;
            }
            
            .result-grid {
                grid-template-columns: 1fr;
            }
            
            .header h1 {
                font-size: 1.5em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Hedged Return Converter</h1>
            <p>CIP-based hedged return conversion across currencies</p>
        </div>
        
        <div class="content">
            <div class="error-message" id="errorMessage"></div>
            
            <form id="calculatorForm">
                <div class="form-section">
                    <h3>Base Currency & Indexer</h3>
                    <div class="form-group">
                        <div>
                            <label for="baseCurrency">Base Currency *</label>
                            <select id="baseCurrency" required onchange="updateIndexers()">
                                <option value="">Select...</option>
                                <option value="BRL">BRL - Brazilian Real</option>
                                <option value="USD">USD - US Dollar</option>
                                <option value="EUR">EUR - Euro</option>
                                <option value="GBP">GBP - British Pound</option>
                            </select>
                        </div>
                        <div>
                            <label for="indexerKey">Indexer Key *</label>
                            <select id="indexerKey" required>
                                <option value="">Select currency first...</option>
                            </select>
                        </div>
                    </div>
                </div>
                
                <div class="form-section">
                    <h3>Target Currency & Parameters</h3>
                    <div class="form-group">
                        <div>
                            <label for="targetCurrency">Target Currency *</label>
                            <select id="targetCurrency" required>
                                <option value="">Select...</option>
                                <option value="BRL">BRL - Brazilian Real</option>
                                <option value="USD">USD - US Dollar</option>
                                <option value="EUR">EUR - Euro</option>
                                <option value="GBP">GBP - British Pound</option>
                            </select>
                        </div>
                        <div>
                            <label for="tenor">Tenor (years) *</label>
                            <input type="number" id="tenor" min="0.1" max="50" step="0.1" value="1" required>
                        </div>
                    </div>
                    <div class="form-group full">
                        <div>
                            <label for="spread">Spread (% p.a.) *</label>
                            <input type="number" id="spread" min="0" max="100" step="0.01" value="2.5" required>
                        </div>
                    </div>
                </div>
                
                <button type="submit" id="calculateBtn">Calculate</button>
            </form>
            
            <div class="results" id="resultsSection">
                <h3>Results</h3>
                
                <div class="result-grid">
                    <div class="result-item">
                        <label>All-In Return (Base CCY)</label>
                        <div class="value"><span id="resultAllInBase">-</span><span class="unit">% p.a.</span></div>
                    </div>
                    <div class="result-item">
                        <label>Hedged Return (Target CCY)</label>
                        <div class="value"><span id="resultUsdEquiv">-</span><span class="unit">% p.a.</span></div>
                    </div>

                    <div class="result-item">
                        <label>Total Return Over Tenor (Base CCY)</label>
                        <div class="value"><span id="resultTotalReturnBase">-</span><span class="unit">%</span></div>
                    </div>
                    <div class="result-item">
                        <label>Total Return Over Tenor (Target CCY)</label>
                        <div class="value"><span id="resultTotalReturnTarget">-</span><span class="unit">%</span></div>
                    </div>
                </div>
                
                <div class="assumptions">
                    <h4>Key Assumptions</h4>
                    <div id="assumptionsList"></div>
                </div>
                
                <div id="warningsList"></div>
            </div>
        </div>
    </div>

    <script>
        const form = document.getElementById('calculatorForm');
        const errorMessage = document.getElementById('errorMessage');
        const resultsSection = document.getElementById('resultsSection');
        const calculateBtn = document.getElementById('calculateBtn');
        
        const API_BASE_URL = window.location.origin + '/api';
        
        // Populate indexer dropdown when base currency changes
        async function updateIndexers() {
            const baseCurrency = document.getElementById('baseCurrency').value;
            const indexerSelect = document.getElementById('indexerKey');
            
            indexerSelect.innerHTML = '<option value="">Select...</option>';
            
            if (!baseCurrency) return;
            
            try {
                const response = await fetch(`${API_BASE_URL}/indexers/${baseCurrency}`);
                if (!response.ok) throw new Error('Failed to fetch indexers');
                
                const data = await response.json();
                data.indexers.forEach(idx => {
                    const option = document.createElement('option');
                    option.value = idx.key;
                    option.textContent = `${idx.label} (${idx.value}%)`;
                    indexerSelect.appendChild(option);
                });
            } catch (err) {
                console.error('Error loading indexers:', err);
                showError('Failed to load indexers. Please try again.');
            }
        }
        
        // Show error message
        function showError(message) {
            errorMessage.textContent = message;
            errorMessage.classList.add('show');
            resultsSection.classList.remove('show');
        }
        
        // Clear error message
        function clearError() {
            errorMessage.classList.remove('show');
            errorMessage.textContent = '';
        }
        
        // Handle form submission
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            clearError();
            
            calculateBtn.disabled = true;
            calculateBtn.innerHTML = '<span class="loading">⏳</span> Calculating...';
            
            const baseCurrency = document.getElementById('baseCurrency').value;
            const indexerKey = document.getElementById('indexerKey').value;
            const targetCurrency = document.getElementById('targetCurrency').value;
            const tenor = parseFloat(document.getElementById('tenor').value);
            const spread = parseFloat(document.getElementById('spread').value);
            
            // Validation
            if (!baseCurrency || !indexerKey || !targetCurrency || !tenor || spread === '') {
                showError('Please fill in all required fields');
                calculateBtn.disabled = false;
                calculateBtn.innerHTML = 'Calculate';
                return;
            }
            
            try {
                const response = await fetch(`${API_BASE_URL}/calculate/hedged-return`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        base_currency: baseCurrency,
                        base_indexer_key: indexerKey,
                        target_currency: targetCurrency,
                        tenor: tenor,
                        spread: spread
                    })
                });
                
                if (!response.ok) {
                    const error = await response.json();
                    throw new Error(error.detail || 'Calculation failed');
                }
                
                const result = await response.json();
                displayResults(result);
                
            } catch (error) {
                console.error('Calculation error:', error);
                showError(`Error: ${error.message}`);
            } finally {
                calculateBtn.disabled = false;
                calculateBtn.innerHTML = 'Calculate';
            }
        });
        
        // Display results
        function displayResults(data) {
            document.getElementById('resultAllInBase').textContent = data.all_in_base_pp.toFixed(4);
            document.getElementById('resultUsdEquiv').textContent = data.usd_equiv_pp.toFixed(4);
            // Total return over tenor (compounded)
            const totalTarget = (data.total_return_target_pp ?? data.total_return_pp);
            const totalBase = (data.total_return_base_pp ?? null);
            document.getElementById('resultTotalReturnTarget').textContent = Number(totalTarget).toFixed(4);
            document.getElementById('resultTotalReturnBase').textContent = totalBase === null ? '-' : Number(totalBase).toFixed(4);
            
            // Assumptions
            const assumptionsList = document.getElementById('assumptionsList');
            assumptionsList.innerHTML = '';
            data.assumptions.forEach(assumption => {
                const div = document.createElement('div');
                div.className = 'assumption-item';
                const hasValue = assumption.value_pp !== null && assumption.value_pp !== undefined;
                div.innerHTML = `
                    <span class="assumption-name">${assumption.name}</span>
                    <span class="assumption-value">${hasValue ? assumption.value_pp.toFixed(4) + '%' : 'N/A'}</span>
                `;
                assumptionsList.appendChild(div);
            });
            
            // Warnings
            const warningsList = document.getElementById('warningsList');
            warningsList.innerHTML = '';
            data.warnings.forEach(warning => {
                const div = document.createElement('div');
                div.className = 'warning';
                div.textContent = warning;
                warningsList.appendChild(div);
            });
            
            resultsSection.classList.add('show');
        }
        
        // Load indexers on page load
        updateIndexers();
    </script>
</body>
</html>
